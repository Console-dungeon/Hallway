name: CI

on:
  pull_request:
    branches: [dev, main]
  # Allows a manual run from the Actions tab
  workflow_dispatch:

# A new push to the same PR cancels the run that is still in progress
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Git hooks are for developers' machines, not CI
  HUSKY: 0
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm from devEngines.packageManager and Node from .nvmrc,
      # restores the pnpm store cache and runs `pnpm install --frozen-lockfile`
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    name: Docker image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [web, api, docs]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build only (no push) – catches a broken Dockerfile before it reaches the deploy
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same services as docker-compose.yml, minus Azurite (not used by the tests yet)
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hallway
          POSTGRES_PASSWORD: hallway
          POSTGRES_DB: hallway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hallway -d hallway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      # .env.example holds working local values: Postgres and Mailpit on localhost
      - run: cp .env.example .env

      - name: Apply database migrations
        run: |
          pnpm turbo run build --filter=@hallway/db
          pnpm db:migrate

      - name: Install the test browser
        run: pnpm --filter @hallway/e2e exec playwright install --with-deps chromium

      # Playwright starts the apps itself (`pnpm dev`) and waits for /api/health
      - run: pnpm test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
